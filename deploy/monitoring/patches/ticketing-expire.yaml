# Strategic-merge patch for cronjob/ticketing-expire (namespace default).
#
#   kubectl -n default patch cronjob ticketing-expire \
#     --patch-file deploy/monitoring/patches/ticketing-expire.yaml
spec:
  jobTemplate:
    spec:
      backoffLimit: 1              # one quick retry for blips; the next run is 4 min later
      activeDeadlineSeconds: 120   # a hung run fails instead of blocking the schedule
      template:
        metadata:
          annotations:
            k8s.grafana.com/logs.job: ticketing-expire-reserved   # logs `job` label
